services:
  jupyter:
    build:
      dockerfile: Dockerfile.jupyter
    container_name: jupyter
    # Host network, like the rest of the stack: the MCP bridge and front-ends
    # reach it on 127.0.0.1 without port plumbing.
    network_mode: host
    environment:
      - JUPYTER_TOKEN=${JUPYTER_TOKEN:?set in .env}
    volumes:
      - ${WORK_DIR:?set in .env}:/home/jovyan/work
    command: >
      start-notebook.sh
      --IdentityProvider.token=${JUPYTER_TOKEN}
      --ServerApp.allow_origin='*'
      --ServerApp.ip='127.0.0.1'
    restart: unless-stopped

  jupyter-mcp:
    image: python:3.11-slim
    container_name: jupyter-mcp
    network_mode: host
    depends_on:
      - jupyter
    environment:
      - JUPYTER_TOKEN=${JUPYTER_TOKEN}
    # jupyter-mcp-server hardcodes uvicorn host=0.0.0.0 (no flag/env, still true
    # as of 1.2.0), so the bind is sed-patched to loopback after install — tied
    # to the ==0.14.0 pin; re-check the sed target when bumping the version.
    command: >
      sh -c "pip install --quiet jupyter-mcp-server==0.14.0 &&
      sed -i 's/host=\"0.0.0.0\"/host=\"127.0.0.1\"/'
      /usr/local/lib/python3.11/site-packages/jupyter_mcp_server/server.py &&
      jupyter-mcp-server start
      --transport streamable-http --port 4040
      --document-url http://127.0.0.1:8888 --document-token $$JUPYTER_TOKEN
      --runtime-url  http://127.0.0.1:8888 --runtime-token  $$JUPYTER_TOKEN"
    restart: unless-stopped
