services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    # Host-сеть, как у zotero: только так контейнер видит MCP-плагин Zotero на
    # 127.0.0.1:23120 и Chromium на 127.0.0.1:9222 без проброса портов.
    network_mode: host
    environment:
      PORT: "${OWUI_PORT:-3111}"
      WEBUI_SECRET_KEY: "${WEBUI_SECRET_KEY:?задать в .env}"
      WEBUI_AUTH: "True"

      # Ключ Model Studio и модели для пайпа qwen_auto.
      DASHSCOPE_API_KEY: "${DASHSCOPE_API_KEY:?задать в .env}"
      DASHSCOPE_BASE_URL: "${DASHSCOPE_BASE_URL:-https://dashscope-intl.aliyuncs.com/compatible-mode/v1}"
      QWEN_TEXT_MODEL: "${QWEN_TEXT_MODEL:-qwen3-max}"
      QWEN_VISION_MODEL: "${QWEN_VISION_MODEL:-qwen3-vl-plus}"
      QWEN_IMAGE_MODEL: "${QWEN_IMAGE_MODEL:-qwen-image-2.0}"
      QWEN_IMAGE_EDIT_MODEL: "${QWEN_IMAGE_EDIT_MODEL:-qwen-image-edit-plus}"
      QWEN_ENABLE_SEARCH: "${QWEN_ENABLE_SEARCH:-true}"

      # Пайп ходит в DashScope сам, поэтому OPENAI_API_* здесь нет: иначе в
      # селекторе всплывут 149 сырых моделей каталога. Останется одна — Qwen Auto.
      DEFAULT_MODELS: "qwen_auto"
      DEFAULT_PINNED_MODELS: "qwen_auto"
      ENABLE_BASE_MODELS_CACHE: "True"
    volumes:
      - ./data:/app/backend/data
    restart: unless-stopped
