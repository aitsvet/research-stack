# Реверс-прокси перед Open WebUI. Ровно эти две строки чинят обе реальные
# проблемы, всплывшие при отладке:
#   * client_max_body_size — nginx по умолчанию режет тело на 1 МБ, и загрузка
#     картинки падала 413-й ошибкой (HTML), а фронтенд валился на JSON.parse.
#     ЭТО И БЫЛА ИСХОДНАЯ ПРИЧИНА «X→JSON.parse: unexpected character».
#   * proxy_buffering off — иначе SSE-поток чата идёт рывками и на длинных
#     ответах может рваться.
#
# Подставьте свой server_name и, при HTTPS, блок с сертификатами.

server {
    listen 80;
    server_name owui.example.org;

    client_max_body_size 50m;      # ← лечит 413 на загрузке картинок

    location / {
        proxy_pass http://127.0.0.1:3111;   # OWUI_PORT из .env
        proxy_http_version 1.1;

        # WebSocket + SSE
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;       # ← ровный SSE-стрим ответов
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
}
