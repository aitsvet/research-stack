services:
  ############################
  # Zotero — reference manager with MCP plugin
  ############################
  zotero:
    image: lscr.io/linuxserver/zotero:latest
    container_name: zotero
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-Etc/UTC}
      - CUSTOM_USER=${ZOTERO_USER:-zotero}
      - PASSWORD=${ZOTERO_PASSWORD}
      - CUSTOM_HTTPS_PORT=8888
      # Loopback-only bindings (host networking exposes every bind directly):
      # the default.conf override pins the web UI to 127.0.0.1, DISABLE_IPV6
      # drops the [::] listens the init script would otherwise generate.
      # NB: that template must stay comment-free — init-nginx runs `sed s/#//g`
      # over it (that's how the auth_basic lines get uncommented), so any
      # added comment line turns into a broken directive.
      - DISABLE_IPV6=true
    volumes:
      - ./config:/config
      - ./docker/zotero/default.conf:/defaults/default.conf:ro
      # Selkies hardcodes 0.0.0.0 for its websocket/control binds (no knob);
      # this init script seds them to loopback before services start. Killing
      # selkies instead is not an option — it leads the desktop session that
      # Zotero (and thus the MCP) and Chromium run in.
      - ./docker/zotero/selkies-loopback.sh:/custom-cont-init.d/selkies-loopback.sh:ro
    network_mode: host
    shm_size: "1gb"
    restart: unless-stopped

  ############################
  # Ollama — local GGUF model runtime (GPU), backs Open WebUI alongside
  # the qwen_auto/DashScope pipe below
  ############################
  ollama:
    image: ollama/ollama:${OLLAMA_DOCKER_TAG:-latest}
    container_name: ollama
    # Opt in explicitly; the default stack is Zotero only.
    profiles: ["extra"]
    network_mode: host
    # Keeps up with upstream tool-calling fixes — Qwen models on Ollama have
    # an active bug history there; see agents-setup/qwen/README.md.
    pull_policy: always
    tty: true
    environment:
      # Host networking means whatever Ollama binds to is exposed exactly as
      # configured — pin to loopback per the standing rule below (Ollama's own
      # default is 0.0.0.0:11434).
      - OLLAMA_HOST=127.0.0.1:11434
      # Sized for a 16GB-VRAM card running qwen3.6:35b (~21-23GB weights,
      # already offloaded) — rationale in agents-setup/qwen/README.md.
      - OLLAMA_CONTEXT_LENGTH=${OLLAMA_CONTEXT_LENGTH:-32768}
      - OLLAMA_FLASH_ATTENTION=1
      - OLLAMA_KV_CACHE_TYPE=q8_0
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-30m}
    volumes:
      - ollama_models:/root/.ollama
      # Modelfiles for local variants, e.g. `docker compose exec ollama
      # ollama create qwen3.6-nothink -f /modelfiles/Modelfile.nothink`
      - ./docker/ollama:/modelfiles:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: ${OLLAMA_GPU_DRIVER:-nvidia}
              count: ${OLLAMA_GPU_COUNT:-1}
              capabilities:
                - gpu
    restart: unless-stopped

  ############################
  # Open WebUI — AI chat frontend
  ############################
  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.9.5
    container_name: open-webui
    # Opt in explicitly; the default stack is Zotero only.
    profiles: ["extra"]
    network_mode: host
    environment:
      # Loopback only — public exposure goes through the system nginx (TLS+auth),
      # which proxies from 127.0.0.1.
      - HOST=127.0.0.1
      - PORT=${OWUI_PORT:-4096}
      - WEBUI_URL=${WEBUI_URL:-http://localhost:4096}
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
      - WEBUI_AUTH=True
      # Local Ollama backend (qwen3.6:35b and friends), alongside the
      # qwen_auto/DashScope pipe below — two backends, one instance.
      - OLLAMA_BASE_URL=http://127.0.0.1:11434
      # DashScope / Qwen models. These are DEFAULTS for the qwen_auto pipe's
      # valves — Open WebUI stores valve values in its own DB, so changing them
      # here does not touch an already-installed pipe (set those in the UI).
      # Model names belong to the endpoint, not to the account: the token-plan
      # host serves ten models and none of the old names. Check the catalogue
      # with `GET $DASHSCOPE_BASE_URL/models` before changing the base URL.
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY}
      - DASHSCOPE_BASE_URL=${DASHSCOPE_BASE_URL:-https://token-plan.ap-southeast-1.maas.aliyuncs.com/compatible-mode/v1}
      # Image models live only on the native API, on the same host.
      - DASHSCOPE_NATIVE_URL=${DASHSCOPE_NATIVE_URL:-https://token-plan.ap-southeast-1.maas.aliyuncs.com}
      # Verified verbatim on a photo of text: qwen3.8 keeps a typo, a translit
      # and an apostrophe intact; qwen3.6-flash silently turns «закят» into
      # «закат», which is the worst kind of error for a transcript.
      - QWEN_TEXT_MODEL=${QWEN_TEXT_MODEL:-qwen3.8-max-preview}
      - QWEN_VISION_MODEL=${QWEN_VISION_MODEL:-qwen3.8-max-preview}
      # One model draws and edits: wan2.7 takes both bare text and image+instruction.
      - QWEN_IMAGE_MODEL=${QWEN_IMAGE_MODEL:-wan2.7-image}
      - QWEN_IMAGE_EDIT_MODEL=${QWEN_IMAGE_EDIT_MODEL:-wan2.7-image}
      # Model defaults
      - DEFAULT_MODELS=qwen_auto
      - DEFAULT_PINNED_MODELS=qwen_auto
      - ENABLE_BASE_MODELS_CACHE=True
      # Open WebUI's evaluation arena injects a fake "Arena Model" entry into
      # the model picker — not wanted here.
      - ENABLE_EVALUATION_ARENA_MODELS=${ENABLE_EVALUATION_ARENA_MODELS:-false}
      # Web search — SearXNG (self-hosted). The built-in OWUI web search is
      # off by default: it re-searches every message and doesn't see the pipe's
      # own search_web/fetch_url, so it duplicates and pollutes. Pipe tools
      # talk to the same SearXNG directly.
      - ENABLE_WEB_SEARCH=${ENABLE_WEB_SEARCH:-false}
      - WEB_SEARCH_ENGINE=searxng
      - SEARXNG_QUERY_URL=http://127.0.0.1:9090/search
      - WEB_SEARCH_TRUST_ENV=true
      # Proxy for outbound requests — set OUTBOUND_PROXY in .env only on hosts
      # that need to tunnel out (e.g. http://127.0.0.1:8118); empty = direct
      - HTTP_PROXY=${OUTBOUND_PROXY:-}
      - HTTPS_PROXY=${OUTBOUND_PROXY:-}
      - ALL_PROXY=${OUTBOUND_PROXY:-}
      - NO_PROXY=localhost,127.0.0.1,::1
    volumes:
      - gptproxy_open-webui:/app/backend/data
    depends_on:
      - searxng
      - ollama
    restart: unless-stopped

  ############################
  # SearXNG — self-hosted meta-search engine
  ############################
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    # Opt in explicitly; the default stack is Zotero only.
    profiles: ["extra"]
    network_mode: host
    volumes:
      - ./config/searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://127.0.0.1:9090
      - GRANIAN_HOST=127.0.0.1
      - GRANIAN_PORT=9090
    restart: unless-stopped

  ############################
  # MCPO — stdio→HTTP MCP proxy for Playwright
  ############################
  mcpo:
    image: ghcr.io/open-webui/mcpo:main
    container_name: mcpo
    # Opt in explicitly; the default stack is Zotero only.
    profiles: ["extra"]
    network_mode: host
    volumes:
      - ./config/mcpo/config.json:/app/config.json:ro
    command: ["--config", "/app/config.json", "--host", "127.0.0.1", "--port", "9320"]
    depends_on:
      - open-webui
    restart: unless-stopped

  ############################
  # Open Terminal — code execution sandbox
  ############################
  open-terminal:
    image: ghcr.io/open-webui/open-terminal:slim
    container_name: open-terminal
    # Opt in explicitly; the default stack is Zotero only.
    profiles: ["extra"]
    network_mode: host
    environment:
      - OPEN_TERMINAL_API_KEY=${OPEN_TERMINAL_API_KEY}
    # The image's default binds 0.0.0.0; `run --host` pins it to loopback.
    command: ["run", "--host", "127.0.0.1"]
    volumes:
      - open-terminal-data:/home/user
    restart: unless-stopped

  ############################
  # Zotero MCP — standalone MCP server for Zotero library
  ############################
  zotero-mcp:
    image: python:3.11-slim
    container_name: zotero-mcp
    # The in-Zotero MCP plugin already serves 127.0.0.1:23120; this standalone
    # server clashes with it. Opt in with: docker compose --profile extra up
    profiles: ["extra"]
    network_mode: host
    environment:
      - ZOTERO_LOCAL=true
      - ZOTERO_MCP_TRANSPORT=streamable-http
      - ZOTERO_MCP_PORT=23120
    command: >
      sh -c "pip install --quiet zotero-mcp-server &&
      zotero-mcp serve --transport streamable-http --host 127.0.0.1 --port 23120"
    depends_on:
      - zotero
    restart: unless-stopped

  ############################
  # docconv — office documents (.rtf/.doc/.docx/.odt) -> Markdown
  ############################
  # One-shot batch converter, not a daemon. Keeps LibreOffice off the host.
  #   docker compose --profile tools run --rm docconv /corpus/<subdir> --dry-run
  #   docker compose --profile tools run --rm docconv /corpus/<subdir>
  # CORPUS points at the document tree to convert (default: ../literature).
  docconv:
    build: ./docker/docconv
    image: research-stack/docconv:latest
    profiles: ["tools"]
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    volumes:
      - ./scripts:/opt/scripts:ro
      - ${CORPUS:-../literature}:/corpus
    working_dir: /corpus

  ############################
  # plantuml — diagram sources (.puml) -> PNG/SVG
  ############################
  # One-shot renderer, not a daemon. Keeps Java and Graphviz off the host.
  #   docker compose --profile tools run --rm plantuml -tpng '<file>.puml'
  # WORK points at the tree holding the diagrams (default: ../diagrams).
  # Output lands beside the source, owned by the host user.
  plantuml:
    build: ./docker/plantuml
    image: research-stack/plantuml:latest
    profiles: ["tools"]
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    volumes:
      - ${WORK:-../diagrams}:/work
    working_dir: /work

volumes:
  gptproxy_open-webui:
    external: true
  open-terminal-data:
  # To point this at an Ollama data dir that already has models pulled
  # (elsewhere, or from a previous bind-mount setup) instead of starting
  # empty, precreate the volume with Compose's own labels attached — that's
  # what makes `docker compose up` treat it as already provisioned instead
  # of erroring "already exists but was not created by Docker Compose."
  # Verified: Compose only checks the project+volume labels below, not the
  # config-hash label it also stamps on volumes it creates itself.
  #   docker volume create --driver local --opt type=none --opt o=bind \
  #     --opt device=/path/to/existing/ollama \
  #     --label com.docker.compose.project=research-stack \
  #     --label com.docker.compose.volume=ollama_models \
  #     research-stack_ollama_models
  # Must run before the first `docker compose ... up -d ollama` in this
  # checkout — if that volume already exists (auto-created empty by an
  # earlier `up`), confirm it's empty, then `docker volume rm` it first.
  # The project-name label must match this checkout's directory name
  # (research-stack); a differently-named checkout gets Compose's own
  # empty volume instead, silently.
  ollama_models:
