services:
  ############################
  # Zotero — reference manager with MCP plugin
  ############################
  zotero:
    image: lscr.io/linuxserver/zotero:latest
    container_name: zotero
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-Etc/UTC}
      - CUSTOM_USER=${ZOTERO_USER:-zotero}
      - PASSWORD=${ZOTERO_PASSWORD}
      - CUSTOM_HTTPS_PORT=8888
    volumes:
      - ./config:/config
    network_mode: host
    shm_size: "1gb"
    restart: unless-stopped

  ############################
  # Open WebUI — AI chat frontend
  ############################
  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.9.5
    container_name: open-webui
    network_mode: host
    environment:
      - PORT=${OWUI_PORT:-4096}
      - WEBUI_URL=${WEBUI_URL:-http://localhost:4096}
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
      - WEBUI_AUTH=True
      # DashScope / Qwen models. These are DEFAULTS for the qwen_auto pipe's
      # valves — Open WebUI stores valve values in its own DB, so changing them
      # here does not touch an already-installed pipe (set those in the UI).
      # Model names belong to the endpoint, not to the account: the token-plan
      # host serves ten models and none of the old names. Check the catalogue
      # with `GET $DASHSCOPE_BASE_URL/models` before changing the base URL.
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY}
      - DASHSCOPE_BASE_URL=${DASHSCOPE_BASE_URL:-https://token-plan.ap-southeast-1.maas.aliyuncs.com/compatible-mode/v1}
      # Image models live only on the native API, on the same host.
      - DASHSCOPE_NATIVE_URL=${DASHSCOPE_NATIVE_URL:-https://token-plan.ap-southeast-1.maas.aliyuncs.com}
      # Verified verbatim on a photo of text: qwen3.8 keeps a typo, a translit
      # and an apostrophe intact; qwen3.6-flash silently turns «закят» into
      # «закат», which is the worst kind of error for a transcript.
      - QWEN_TEXT_MODEL=${QWEN_TEXT_MODEL:-qwen3.8-max-preview}
      - QWEN_VISION_MODEL=${QWEN_VISION_MODEL:-qwen3.8-max-preview}
      # One model draws and edits: wan2.7 takes both bare text and image+instruction.
      - QWEN_IMAGE_MODEL=${QWEN_IMAGE_MODEL:-wan2.7-image}
      - QWEN_IMAGE_EDIT_MODEL=${QWEN_IMAGE_EDIT_MODEL:-wan2.7-image}
      # Model defaults
      - DEFAULT_MODELS=qwen_auto
      - DEFAULT_PINNED_MODELS=qwen_auto
      - ENABLE_BASE_MODELS_CACHE=True
      # Open WebUI's evaluation arena injects a fake "Arena Model" entry into
      # the model picker — not wanted here.
      - ENABLE_EVALUATION_ARENA_MODELS=${ENABLE_EVALUATION_ARENA_MODELS:-false}
      # Web search — SearXNG (self-hosted). The built-in OWUI web search is
      # off by default: it re-searches every message and doesn't see the pipe's
      # own search_web/fetch_url, so it duplicates and pollutes. Pipe tools
      # talk to the same SearXNG directly.
      - ENABLE_WEB_SEARCH=${ENABLE_WEB_SEARCH:-false}
      - WEB_SEARCH_ENGINE=searxng
      - SEARXNG_QUERY_URL=http://127.0.0.1:9090/search
      - WEB_SEARCH_TRUST_ENV=true
      # Proxy for outbound requests — set OUTBOUND_PROXY in .env only on hosts
      # that need to tunnel out (e.g. http://127.0.0.1:8118); empty = direct
      - HTTP_PROXY=${OUTBOUND_PROXY:-}
      - HTTPS_PROXY=${OUTBOUND_PROXY:-}
      - ALL_PROXY=${OUTBOUND_PROXY:-}
      - NO_PROXY=localhost,127.0.0.1,::1
    volumes:
      - gptproxy_open-webui:/app/backend/data
    depends_on:
      - searxng
    restart: unless-stopped

  ############################
  # SearXNG — self-hosted meta-search engine
  ############################
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    network_mode: host
    volumes:
      - ./config/searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://127.0.0.1:9090
      - GRANIAN_PORT=9090
    restart: unless-stopped

  ############################
  # MCPO — stdio→HTTP MCP proxy for Playwright
  ############################
  mcpo:
    image: ghcr.io/open-webui/mcpo:main
    container_name: mcpo
    network_mode: host
    volumes:
      - ./config/mcpo/config.json:/app/config.json:ro
    command: ["--config", "/app/config.json", "--port", "9320"]
    depends_on:
      - open-webui
    restart: unless-stopped

  ############################
  # Open Terminal — code execution sandbox
  ############################
  open-terminal:
    image: ghcr.io/open-webui/open-terminal:slim
    container_name: open-terminal
    network_mode: host
    environment:
      - OPEN_TERMINAL_API_KEY=${OPEN_TERMINAL_API_KEY}
    volumes:
      - open-terminal-data:/home/user
    restart: unless-stopped

  ############################
  # Zotero MCP — standalone MCP server for Zotero library
  ############################
  zotero-mcp:
    image: python:3.11-slim
    container_name: zotero-mcp
    # The in-Zotero MCP plugin already serves 127.0.0.1:23120; this standalone
    # server clashes with it. Opt in with: docker compose --profile extra up
    profiles: ["extra"]
    network_mode: host
    environment:
      - ZOTERO_LOCAL=true
      - ZOTERO_MCP_TRANSPORT=streamable-http
      - ZOTERO_MCP_PORT=23120
    command: >
      sh -c "pip install --quiet zotero-mcp-server &&
      zotero-mcp serve --transport streamable-http --port 23120"
    depends_on:
      - zotero
    restart: unless-stopped

  ############################
  # docconv — office documents (.rtf/.doc/.docx/.odt) -> Markdown
  ############################
  # One-shot batch converter, not a daemon. Keeps LibreOffice off the host.
  #   docker compose --profile tools run --rm docconv /corpus/<subdir> --dry-run
  #   docker compose --profile tools run --rm docconv /corpus/<subdir>
  # CORPUS points at the document tree to convert (default: ../literature).
  docconv:
    build: ./docker/docconv
    image: research-stack/docconv:latest
    profiles: ["tools"]
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    volumes:
      - ./scripts:/opt/scripts:ro
      - ${CORPUS:-../literature}:/corpus
    working_dir: /corpus

volumes:
  gptproxy_open-webui:
    external: true
  open-terminal-data:
